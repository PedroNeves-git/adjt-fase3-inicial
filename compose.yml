services:                                                 
    procpag:
      image: docker.io/erickemprobr/procpag:latest
      platform: linux/amd64                                                                                                    
      ports:
        - "8089:8089"                                                                                                          
      networks:                                                                                                                
        - fase3net
                                                                                                                               
    auth-db:                                                
      image: mysql:8.0
      container_name: auth-db
      restart: always
      environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: authdb                                                                                                 
        MYSQL_USER: dev
        MYSQL_PASSWORD: dev                                                                                                    
      ports:                                                                                                                   
        - "3307:3306"
      volumes:                                                                                                                 
        - auth_db_data:/var/lib/mysql                       
        - ./auth-service/db/init:/docker-entrypoint-initdb.d
      healthcheck:                                                                                                             
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 10s                                                                                                          
        timeout: 5s                                         
        retries: 5                                                                                                             
      networks:                                             
        - fase3net

    auth-service:
      build: ./auth-service
      container_name: auth-service                                                                                             
      restart: always
      depends_on:                                                                                                              
        auth-db:                                            
          condition: service_healthy
      ports:
        - "8081:8081"
      environment:
        SERVER_PORT: 8081
        JWT_SECRET: "bWluaGEtY2hhdmUtc3VwZXItc2VjcmV0YS1jb20tbWFpcy1kZS0zMi1jYXJhY3RlcmVz"
        SPRING_DATASOURCE_URL: jdbc:mysql://auth-db:3306/authdb                                                                
        SPRING_DATASOURCE_USERNAME: dev                                                                                        
        SPRING_DATASOURCE_PASSWORD: dev                                                                                        
        SPRING_JPA_HIBERNATE_DDL_AUTO: update                                                                                  
      networks:                                                                                                                
        - fase3net
                                                                                                                               
    zookeeper:                                              
      image: confluentinc/cp-zookeeper:7.6.1
      container_name: zookeeper
      restart: always                                                                                                          
      environment:
        ZOOKEEPER_CLIENT_PORT: 2181                                                                                            
        ZOOKEEPER_TICK_TIME: 2000                           
      ports:                                                                                                                   
        - "2181:2181"
      networks:                                                                                                                
        - fase3net                                          

    kafka:
      image: confluentinc/cp-kafka:7.6.1
      container_name: kafka
      restart: always                                                                                                          
      depends_on:
        - zookeeper                                                                                                            
      ports:                                                
        - "9092:9092"
        - "29092:29092"
      environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181                                                                                
        KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092                                    
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT                                     
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT                                                                            
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1                                                                              
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1                                                                      
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1                                                                                 
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"             
      healthcheck:                                                                                                             
        test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
        interval: 10s                                                                                                          
        timeout: 10s                                        
        retries: 10                                                                                                            
      networks:                                             
        - fase3net

    order-db:
      image: mysql:8.0
      container_name: order-db
      restart: always                                                                                                          
      environment:
        MYSQL_ROOT_PASSWORD: root                                                                                              
        MYSQL_DATABASE: ordersdb                            
        MYSQL_USER: dev
        MYSQL_PASSWORD: dev                                                                                                    
      ports:
        - "3308:3306"                                                                                                          
      volumes:                                              
        - order_db_data:/var/lib/mysql
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]                                                                 
        interval: 10s
        timeout: 5s                                                                                                            
        retries: 5                                          
      networks:
        - fase3net
                                                                                                                               
    order-service:
      build: ./order-service                                                                                                   
      container_name: order-service                         
      restart: always
      depends_on:
        order-db:
          condition: service_healthy
        kafka:
          condition: service_healthy                                                                                           
      ports:
        - "8082:8082"                                                                                                          
      environment:                                          
        SERVER_PORT: 8082
        JWT_SECRET: "bWluaGEtY2hhdmUtc3VwZXItc2VjcmV0YS1jb20tbWFpcy1kZS0zMi1jYXJhY3RlcmVz"
        SPRING_DATASOURCE_URL: jdbc:mysql://order-db:3306/ordersdb?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
        SPRING_DATASOURCE_USERNAME: dev                                                                                        
        SPRING_DATASOURCE_PASSWORD: dev                                                                                        
        SPRING_JPA_HIBERNATE_DDL_AUTO: update               
        SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092                                                                             
      networks:
        - fase3net                                                                                                             
                                                                                                                               
    payment-service:
      build: ./payment-service                                                                                                 
      container_name: payment-service                       
      restart: always
      depends_on:
        kafka:
          condition: service_healthy
      ports:
        - "8083:8083"                                                                                                          
      environment:
        SERVER_PORT: 8083                                                                                                      
        KAFKA_BOOTSTRAP_SERVERS: kafka:9092                 
        PROCPAG_URL: http://procpag:8089
      networks:                                                                                                                
        - fase3net
                                                                                                                               
networks:
  fase3net:

volumes:
  auth_db_data:
  order_db_data: