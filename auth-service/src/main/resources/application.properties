spring.application.name=auth-service

server.port=8081

api.version=v1
server.servlet.context-path=/api-users/${api.version}

# DATASOURCE
spring.datasource.url=jdbc:mysql://auth-db:3306/authdb?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JWT
security.jwt.secret=${JWT_SECRET:my-secret-key}
